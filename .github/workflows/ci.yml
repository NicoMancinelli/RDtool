name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - name: Verify bundle
        run: |
          test -f dist/real-debrid-suite.user.js
          grep -q '@version' dist/real-debrid-suite.user.js
          grep -q 'GM_addStyle' dist/real-debrid-suite.user.js
