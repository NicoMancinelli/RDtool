name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # CI runs with NODE_ENV unset (GitHub Actions default), so `npm ci`
      # installs devDependencies. Keep this guard for safety.
      - name: Verify NODE_ENV is not 'production'
        run: |
          if [ "$NODE_ENV" = "production" ]; then
            echo "NODE_ENV=production skips devDependencies — refusing to lint/test against a broken tree."
            exit 1
          fi

      - run: npm ci

      # Audit gate: rejects HIGH/CRITICAL transitive vulns (per HER-116 decision,
      # eslint v10 transitively resolves all known HIGHs). `--audit-level=high`
      # exits 1 only on HIGH/CRITICAL; MODERATE/LOW are reported but not blocking.
      - name: Audit (HIGH+ gate)
        run: npm audit --audit-level=high

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - name: Verify bundle
        run: |
          test -f dist/real-debrid-suite.user.js
          grep -q '@version' dist/real-debrid-suite.user.js
          grep -q 'GM_addStyle' dist/real-debrid-suite.user.js

      - name: Upload userscript bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: real-debrid-suite
          path: dist/real-debrid-suite.user.js
          if-no-files-found: error
          retention-days: 14